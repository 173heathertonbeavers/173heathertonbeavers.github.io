function buildArchive() {

    const sortedPosts = [...posts].sort(
        (a, b) => new Date(b.date) - new Date(a.date)
    );

    /* ---------- FEATURED POST ---------- */

    const featured = document.getElementById("featured");

    if (sortedPosts.length > 0) {

        const latest = sortedPosts[0];

        featured.innerHTML = `
            <article class="news-post">
                <h2>${latest.title}</h2>
                <p><strong>${latest.date}</strong></p>
                ${latest.content}
            </article>
        `;
    }

    /* ---------- ARCHIVE ---------- */

    const archive = document.getElementById("archive");

    archive.innerHTML = "";

    const archivePosts = sortedPosts.slice(1);

    const grouped = {};

    archivePosts.forEach(post => {

        const year = new Date(post.date).getFullYear();

        if (!grouped[year]) {
            grouped[year] = [];
        }

        grouped[year].push(post);

    });

    Object.keys(grouped)
        .sort((a, b) => b - a)
        .forEach(year => {

            const yearDiv = document.createElement("div");
            yearDiv.className = "archive-year";

            yearDiv.innerHTML = `
                <div class="year-header">
                    <span class="triangle"></span>
                    <strong>${year}</strong>
                </div>

                <div class="year-content"></div>
            `;

            const yearContent =
                yearDiv.querySelector(".year-content");

            grouped[year].forEach(post => {

                const postDiv = document.createElement("div");
                postDiv.className = "archive-post";

                postDiv.innerHTML = `
                    <div class="post-header">
                        <span class="triangle"></span>
                        <strong>${post.title}</strong>
                        <span class="date">
                            (${post.date})
                        </span>
                    </div>

                    <div class="post-content">
                        ${post.content}
                    </div>
                `;

                const postHeader =
                    postDiv.querySelector(".post-header");

                postHeader.addEventListener("click", () => {

                    const isOpen =
                        postDiv.classList.contains("open");

                    yearContent
                        .querySelectorAll(".archive-post")
                        .forEach(p => p.classList.remove("open"));

                    if (!isOpen) {
                        postDiv.classList.add("open");
                    }

                    initFullscreenImages();

                });

                yearContent.appendChild(postDiv);

            });

            const yearHeader =
                yearDiv.querySelector(".year-header");

            yearHeader.addEventListener("click", () => {

                const isOpen =
                    yearDiv.classList.contains("open");

                document
                    .querySelectorAll(".archive-year")
                    .forEach(y => {

                        y.classList.remove("open");

                        y.querySelectorAll(".archive-post")
                            .forEach(p => p.classList.remove("open"));

                    });

                if (!isOpen) {
                    yearDiv.classList.add("open");
                }

            });

            archive.appendChild(yearDiv);

        });

    initFullscreenImages();

}

buildArchive();
